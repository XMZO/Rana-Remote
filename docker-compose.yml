services:
  rana-api:
    image: ${RANA_IMAGE:-ghcr.io/xmzo/rana-remote:latest}
    pull_policy: always
    container_name: rana-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      RANA_IMAGE: ${RANA_IMAGE:-ghcr.io/xmzo/rana-remote:latest}
    volumes:
      - ./data:/data
      - ${HOME}/.ssh:/root/.ssh:ro
    command: ["-migrate"]
